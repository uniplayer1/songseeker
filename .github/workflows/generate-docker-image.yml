name: Generate and upload SongSeeker image

on:
  push:
    branches: [ "main", "release/*", "develop", "develop/*" ]
  pull_request:
    branches: [ "main", "release/*", "develop", "develop/*" ]
  release:
    types: [published]
  workflow_dispatch:

# Permissions needed for checkout and (optionally) cache
permissions:
  contents: read
  # id-token: write   # only needed if using OIDC for Docker login in future

jobs:
  get_environment:
    runs-on: ubuntu-latest

    steps:
      - name: Define the used environment
        id: env_check
        run: |
          ENV_NAME=staging
          if [[ "${{ github.event_name }}" == "release" ]]; then
            ENV_NAME=production
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ENV_NAME=staging
          else
            ENV_NAME=staging
          fi

          echo "Chosen environment: ${ENV_NAME}"

          echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT

    outputs:
      env_name: ${{ steps.env_check.outputs.env_name }}

  generate-songseeker-image:
    needs: [get_environment]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.get_environment.outputs.env_name }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./imagebuild/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKER_IMAGE }}
          # Use GitHub Actions cache for faster subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Set to false if you run into attestation issues with older Docker Hub setups
          # provenance: false

